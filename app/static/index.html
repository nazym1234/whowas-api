<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhoWas — Questions biographiques</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <span class="badge">Wikidata · Version 2</span>
      <h1>Une question sur une personnalité ?</h1>
      <p>Écris directement le nom dans ta question et obtiens une réponse accompagnée de sa donnée source.</p>
    </header>

    <section class="panel">
      <label for="question">Question</label>
      <input id="question" value="Où est née Marie Curie ?" maxlength="300">

      <div class="examples">
        <button data-question="Quand est né Albert Einstein ?">Naissance</button>
        <button data-question="Où est née Marie Curie ?">Lieu</button>
        <button data-question="Quelle était la profession d'Alan Turing ?">Profession</button>
        <button data-question="Quels prix a reçu Nelson Mandela ?">Distinctions</button>
      </div>

      <button id="ask" class="primary">Obtenir la réponse</button>
    </section>

    <section id="result" class="result hidden" aria-live="polite"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
