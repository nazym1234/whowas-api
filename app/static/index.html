<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhoWas — Questions biographiques</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <span class="badge">Wikidata + Wikipédia · Version 4</span>
      <h1>Une question sur une personnalité ?</h1>
      <p>Pose une question, calcule un âge, compare deux personnes ou continue avec « il » et « elle ». Chaque réponse reste traçable jusqu'à sa source.</p>
    </header>

    <section class="panel">
      <label for="question">Question</label>
      <input id="question" value="Où est née Marie Curie ?" maxlength="300">

      <div class="examples">
        <button data-question="Quel âge a Margot Robbie ?">Âge</button>
        <button data-question="Qui est le plus âgé entre Messi et Ronaldo ?">Comparer</button>
        <button data-question="Combien de temps Marie Curie a-t-elle vécu ?">Durée de vie</button>
        <button data-question="Quelle est la couleur des yeux de David Bowie ?">Question libre</button>
      </div>

      <button id="ask" class="primary">Obtenir la réponse</button>
    </section>

    <section id="result" class="result hidden" aria-live="polite"></section>
    <section id="history" class="history" aria-label="Historique des questions"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
