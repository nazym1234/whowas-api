<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhoWas — Questions biographiques</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <span class="badge">Wikidata · Version 3</span>
      <h1>Une question sur une personnalité ?</h1>
      <p>Pose une question libre sur une personnalité. WhoWas identifie la personne, comprend la propriété recherchée et cite sa source.</p>
    </header>

    <section class="panel">
      <label for="question">Question</label>
      <input id="question" value="Où est née Marie Curie ?" maxlength="300">

      <div class="examples">
        <button data-question="Qui est Margot Robbie ?">Présentation</button>
        <button data-question="Combien d'enfants a Barack Obama ?">Comptage</button>
        <button data-question="Quelle est la taille de Michael Jordan ?">Taille</button>
        <button data-question="Quelle est la couleur des yeux de David Bowie ?">Question libre</button>
      </div>

      <button id="ask" class="primary">Obtenir la réponse</button>
    </section>

    <section id="result" class="result hidden" aria-live="polite"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
